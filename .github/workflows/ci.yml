name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Тесты, которым нужна настоящая база (tenant-isolation, идемпотентность
      # Zernio, гонки в корзине), сами пропускают себя через describe.skipIf,
      # когда переменные ниже не заданы в секретах репозитория — так что этот
      # шаг безопасен без секретов, просто прогонит меньше тестов.
      - name: Tests
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TENANT_KEY: ${{ secrets.SUPABASE_TENANT_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # tests/tenant-isolation.test.ts требует ещё и этот ключ отдельно от
          # четырёх выше — без него самый важный тест (изоляция арендаторов)
          # тихо пропускал себя даже при настроенных остальных секретах.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Идёт последним и намеренно: новая high/critical CVE в транзитивной
      # зависимости не должна прятать результаты lint/typecheck/build/test —
      # раньше audit стоял первым и 35 запусков подряд падали здесь, ни разу
      # не дав увидеть, проходят ли остальные проверки.
      - name: Audit dependencies
        run: npm audit --audit-level=high
